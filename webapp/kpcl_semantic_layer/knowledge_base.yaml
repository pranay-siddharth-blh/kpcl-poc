projects:
  - id: sharavathi_psp
    name: Sharavathi Pumped Storage Project
    aliases: [sharavathi pumped storage, sharavathi psp, pumped storage project, pumped storage]
    summary: >-
      KPCL has proposed a 2,000 MW (8 x 250 MW) pumped storage project on the Sharavathi river. It would
      pump water between two existing reservoirs to store surplus power and release it at peak demand. The
      CEA approved it in August 2024, the State Board for Wildlife in January 2025, and the National Board
      for Wildlife gave in-principle approval in July 2025. Forest clearance was contested, and reports say
      the Government of India put the project on hold in November 2025 over the loss of Western Ghats
      forest.
    sources:
      - https://en.wikipedia.org/wiki/Sharavathi_Pumped_Storage_Hydropower_Project
      - https://www.landconflictwatch.org/conflicts/environmentalists-raise-concerns-over-sharavathi-pumped-storage-project-in-karnataka
      - https://kpcl.karnataka.gov.in/31/proposed-projects/en
  - id: proposed_projects
    name: KPCL's proposed projects
    aliases: [proposed projects, upcoming projects, future projects, new projects, planned projects, pipeline projects, projects in the pipeline,
              ongoing projects, projects of kpcl, kpcl projects, capacity addition plans, expansion plans]
    summary: |-
      KPCL lists four proposed projects, together about 5,300 MW:
      •  Godhna Thermal Power Station: 1,600 MW (2 x 800 MW), coal-fired, in Janjgir-Champa district, Chhattisgarh, where KPCL has a project office.
      •  Sharavathi pumped storage plant: 2,000 MW in the Sharavathi basin. Ask "What is the Sharavathi pumped storage project?" for its approvals.
      •  Varahi pumped storage plant: 1,500 MW in the Varahi basin.
      •  Shivanasamudra seasonal scheme: 200 MW (2 units) on the Kaveri at Shivanasamudra.
      Its two most recent projects, the 370 MW Yelahanka combined cycle plant and the 11.5 MW Bidadi waste-to-energy plant, are already in this system's station records. KPCL is also developing captive coal mines: the Baranj mines in Maharashtra and the Mandakini-A block in Odisha.
    sources:
      - https://kpcl.karnataka.gov.in/31/proposed-projects/en
      - https://kpcl.karnataka.gov.in/30/ongoing-projects/en
  - id: varahi_psp
    name: Varahi pumped storage project
    aliases: [varahi pumped storage, varahi psp, varahi basin pumped storage, varahi pumped storage project, varahi pumped storage plant]
    summary: >-
      KPCL has proposed a 1,500 MW pumped storage plant in the Varahi basin, near its existing Varahi Underground
      Power House in Udupi district. Like the Sharavathi scheme, it would pump water uphill when power is spare and
      generate with it at peak demand. It is listed among KPCL's proposed projects.
    sources: [https://kpcl.karnataka.gov.in/31/proposed-projects/en]
  - id: godhna
    name: Godhna Thermal Power Station (proposed)
    aliases: [godhna, godhna thermal, godhna thermal power station, godhna project, chhattisgarh project]
    summary: >-
      Godhna Thermal Power Station is a proposed 1,600 MW (2 x 800 MW) coal-fired station of KPCL in Janjgir-Champa
      district, Chhattisgarh. KPCL keeps a project office there, and its organisation includes a Chief Engineer
      (Mines) for Godhna.
    sources:
      - https://kpcl.karnataka.gov.in/31/proposed-projects/en
      - "KPCL RTI 4(1)(b) handbook, section 1.6 (Godhna office address); organogram 25.05.2026"
  - id: shivanasamudra_seasonal
    name: Shivanasamudra seasonal scheme (proposed)
    aliases: [shivanasamudra seasonal, shivanasamudra seasonal scheme, shivasamudram seasonal, seasonal scheme]
    summary: >-
      The Shivanasamudra seasonal scheme is a proposed 200 MW (2 units) hydro project on the Kaveri at
      Shivanasamudra, the site of Asia's first hydro-electric station (1902). It would use the river's high flows
      during the monsoon season.
    sources: [https://kpcl.karnataka.gov.in/31/proposed-projects/en, https://kpcl.karnataka.gov.in/20/about--us/en]

