    aliases: [awards, kpcl awards, awards won, honours, recognition, karnataka ratna award, igbc, green building award]
    summary: |-
      KPCL lists awards going back to the late 1980s, among them:
      •  2022: IGBC Platinum certification for its Green Building headquarters.
      •  2008-09: the Government of Karnataka's award for the best overall performance among public sector undertakings, and gold and bronze medals for the Varahi project for early completion and performance.
      •  2008: first prize for Raichur Unit 6 as the best safe power boiler (37th National Safety Council awards), and an IEEMA first prize for excellence for the Sharavathi Generating Station.
      •  2005-2008: awards for Gerusoppa, Kodasalli and Varahi as among the best-performing hydel stations, and for Almatti Units 3 and 6 as best-executed projects.
      •  1988 to 2004: repeated cash awards, medals and shields for high plant load factor and for cutting auxiliary consumption and secondary fuel oil at the Raichur thermal station.
    sources: [https://kpcl.karnataka.gov.in/24/awards/en]
  - id: consultancy
