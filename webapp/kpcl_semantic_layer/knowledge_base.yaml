companies:
  - id: rpcl
    name: Raichur Power Corporation Limited (RPCL)
    aliases: [rpcl, raichur power corporation, raichur power corporation limited]
    summary: >-
      Raichur Power Corporation Limited is a joint venture of KPCL and Bharat Heavy Electricals Limited
      (BHEL), set up to build and own the Yeramarus Thermal Power Station (2 x 800 MW) in Raichur
      district. BHEL was also the plant's engineering, procurement and construction contractor. Published
      sources differ on the exact shareholding, so none is given here.
    in_this_data: KPCL totals in this assistant always include YTPS.
    sources:
      - https://en.wikipedia.org/wiki/Yermarus_Thermal_Power_Station
      - https://www.bhel.com/bhel-commissions-800-mw-supercritical-thermal-power-plant-karnataka
  - id: kpcgpcl
    name: KPCL Gas Power Corporation Limited (KPCGPCL)
    aliases: [kpcgpcl, kpcl gas power corporation, gas power corporation]
    summary: >-
      KPCL Gas Power Corporation Limited is the KPCL company that owns the 370 MW Yelahanka Combined
      Cycle Power Plant in Bengaluru, Karnataka's first and only gas-based power station. Natural gas is
      supplied by GAIL through the Dabhol-Bengaluru pipeline.
    in_this_data: KPCL totals in this assistant always include the Yelahanka plant.
    sources:
      - https://www.businessworld.in/article/karnataka%E2%80%99s-first-gas-based-power-plant-yelahanka-ccpp-to-be-commissioned-on-24-september-534064
      - https://www.deccanherald.com/india/karnataka/bengaluru/yelahanka-s-370-mw-gas-power-plant-set-for-april-launch-2904700
      - https://kpcl.karnataka.gov.in/25/joint-ventures/en (listed as KPCL's subsidiary)
  - id: kecml
    name: Karnataka EMTA Coal Mines Limited (KECML) and the Baranj coal mines
    aliases: [kecml, karnataka emta, karnataka emta coal mines, emta, baranj, baranj mine, baranj mines, baranj coal, baranj open cast, bocm, coal mines of kpcl, kpcl coal mine, kpcl coal mines, captive coal, captive mine]
    summary: >-
      Karnataka EMTA Coal Mines Limited is a joint venture that KPCL formed with Eastern Mining and Trading
      Agency (EMTA) under an agreement of September 2002, to mine coal from the Baranj I-IV, Manoradeep and
      Kiloni blocks near Bhadravati in Chandrapur district, Maharashtra, and send it to the Bellary Thermal
      Power Station. Mining began around 2008-09. In 2014 the Supreme Court cancelled the allocation of 214
      coal blocks across the country, including these, and on 31 March 2015 the blocks were allotted again to
      KPCL under the Coal Mines (Special Provisions) Act, 2015. KPCL now runs them as the Baranj Open Cast
      Mining Project, which has its own environmental clearance and six-monthly compliance reports, and a Chief
      Engineer (Mines) for Baranj in its organisation. The joint venture's affairs have been the subject of
      court cases, so its shareholding is not given here.
    in_this_data: >-
      Coal receipts in this system are recorded by supplier and source, so you can ask, for example, "Coal
      received by supplier at BTPS in FY 2024-25".
    sources:
      - https://kpcl.karnataka.gov.in/25/joint-ventures/en
      - https://kpcl.karnataka.gov.in/136/environment/en
      - https://www.gem.wiki/Integrated_Baranj_Mine
      - https://indiankanoon.org/doc/192257583/

