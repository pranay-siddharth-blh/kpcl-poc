# What KPCL makes public, and other things it is known for.
public_information:
  - id: public_data
    name: What information KPCL makes public
    aliases: [public data, public information, what does kpcl publish, what information does kpcl publish, published data,
              kpcl disclosures, disclosures, kpcl website, official website, what data is public, open data, annual report,
              kpcl annual report, financial statements, profit and loss, budget book, annual return, tariff application,
              tariff petition, sale of energy]
    summary: |-
      KPCL publishes a good deal about itself:
      •  Finance: annual reports, profit and loss statements, income and expenditure, sale of energy, the budget book and the annual return, plus tariff applications filed with the state regulator (for example for Bellary Thermal Power Station Unit 3).
      •  Generation: generation performance, monthly performance of the thermal stations, performance of the major hydro stations, generation graphs and reports, and installed capacity by station.
      •  Technical and environment: water use by station, generator voltages and transmission lines, technical case studies, fly ash utilisation at the Raichur, Bellary and Yeramarus stations, and the environmental clearances and compliance reports of the Yelahanka plant and the Baranj coal mines.
      •  Governance: the Board, senior officials, mission, policies (CSR and Whistle Blower), joint ventures, awards, and the Right to Information disclosures, including the organisation chart, delegation of powers, officers' pay and the budget.
      •  People and suppliers: recruitment notifications and results, seniority lists, reservation notifications, pension slips and tax forms for staff, agency payments, blacklisted firms and holiday lists.
      The generation figures in this assistant come from its own records for April 2015 to April 2025.
    sources:
