# How KPCL is organised: its governing bodies, hierarchy, offices and how decisions are made.
# Structure only; no names of office holders (they change). Organogram as updated on 25 May 2026.
organisation:
  - id: hierarchy
    name: How KPCL is organised
    aliases: [organisation structure, organization structure, organisational structure, organizational structure, organogram,
              organigram, org chart, organisation chart, organization chart, hierarchy, kpcl hierarchy, reporting structure,
              chain of command, management structure, structure of kpcl, kpcl structure, who reports to, reports to whom,
              wings of kpcl, departments of kpcl, kpcl departments, divisions of kpcl, reports to the technical director,
              reports to the finance director, reports to the director hr, reports to the managing director, reports to the md,
              under the technical director, under the finance director, under the director hr, under the managing director,
              who heads rtps, who heads btps, who heads ytps, who heads a power station, who heads the stations]
    summary: |-
      KPCL's hierarchy runs from the Chairman to the Board of Directors and then to the Managing Director, who heads the company. Three full-time directors report to the Managing Director, each with their own wing, and a few offices report to the Managing Director directly.
      •  Technical Director: the power stations and projects. Under this post are the Executive Directors of the three thermal stations (Raichur, Bellary and Yeramarus); Chief Engineers for thermal designs, electrical designs, civil designs, systems, mines and the Yelahanka gas plant; the Chief Engineers for operation and maintenance and for civil works in the Sharavathi and Kali valleys; the Chief Engineers (Mines) for Godhna, the Mandakini coal block and the Baranj open cast mines; and three Superintending Engineers and a Resident Engineer.
      •  Finance Director: finance and accounts, through two General Managers at the head office and the General Manager (Finance) of Raichur Power Corporation Limited.
      •  Director (HR): people and administration, through the General Manager (Administration & HR), two Assistant General Managers (one for HR development) and the medical officer.
      •  Reporting directly to the Managing Director: the Chief Vigilance Officer, the General Manager (Internal Audit), the General Manager (Corporate Affairs) who is also the Company Secretary, the Head of Legal Services, and the Head of land acquisition and rehabilitation & resettlement.
      Each power station or valley project is run by an Executive Director (thermal stations) or a Chief Engineer (hydro valleys), who reports up the technical wing.
    in_this_data: >-
      Ask "What does the Board of Directors do?", "What are the board committees?" or "What are the management
      levels in KPCL?" for more on each part.
    sources:
      - "KPCL organogram (Annexure-A to the RTI 4(1)(b) disclosures), updated 25.05.2026: https://kpcl.karnataka.gov.in/uploads/media_to_upload1780384819.pdf"
      - https://kpcl.karnataka.gov.in/3/kpcl-senior-officials/en
  - id: board
    name: KPCL's Board of Directors
    aliases: [board of directors, kpcl board, kpcl's board, the board, board members, members of the board, chairman of kpcl,
              kpcl chairman, chairman of the board, vice chairman, vice-chairman, directors of kpcl, board composition,
              who is on the board, board meetings]
    summary: >-
      Under its Articles of Association, KPCL is managed by a Board of Directors constituted by the Government of
      Karnataka from time to time. By convention the Chief Minister is appointed Chairman and the Minister for
      Energy Vice Chairman; the other members are senior IAS officers, technocrats and professionals appointed by
      the state. The Board takes all major decisions, approves the capital and revenue budget each year after the
      Audit Committee has vetted it, and has delegated substantial management powers to the Managing Director. It
      meets at least four times a year. Its minutes are not public under company law, although information can
      be sought under the Right to Information Act. This assistant does not name KPCL's current office holders
      because they change. The current Board and senior officers are listed on KPCL's official website.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, sections 1.1, 3.4, chapters 8 and 11: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
  - id: board_committees
    name: Committees of KPCL's Board
    aliases: [board committees, committees of the board, board sub committees, sub committees, sub-committees, subcommittees,
              audit committee, technical committee, csr committee, negotiation committee, committees of kpcl]
    summary: |-
      The Board works through sub-committees whose members come from the Board itself:
      •  Audit Committee: vets the annual capital and revenue budget, advises on accounts and audit, and is where whistle-blower complaints are finally decided. It meets at least three times a year.
      •  Technical Committee: advises on technical matters and meets as the company's work requires.
      •  CSR Committee: recommends the company's social-responsibility spending and annual action plan to the Board. Under KPCL's CSR policy it is chaired by the Additional Chief Secretary of the Energy Department, with the Additional Chief Secretary of the Finance Department and KPCL's Managing Director as members.
      •  Board sub-committees for negotiations.
      Major decisions are taken by the Managing Director in consultation with the Audit and Technical Committees before going to the Board. For dam safety, KPCL also has a panel of independent experts.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, sections 3.4 and 8: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
      - "KPCL CSR Policy (Board, 284th meeting, 08.04.2022): https://kpcl.karnataka.gov.in/storage/pdf-files/CSR%20Policy%20_KPCL%202021-22.pdf"
  - id: managing_director
    name: The Managing Director and the full-time directors
    aliases: [managing director, md of kpcl, kpcl md, kpcl's md, the md, role of the md, powers of the md, technical director,
              finance director, director hr, director (hr), hr director, functional directors, full time directors,
              full-time directors, whole time directors, whole-time directors]
    summary: >-
      KPCL has four full-time directors. The Managing Director, the head of the company, is appointed by the
      Government of Karnataka from among senior civil-service officers; the Board has vested this post with
      substantial administrative and managerial powers, which it passes down through a scheme of delegation. The
      Technical Director and the Finance Director are appointed from among the company's own senior officers, and
      the Director (HR) is appointed by the state from among Karnataka Administrative Service officers. The Technical
      Director oversees the power stations and projects, the Finance Director finance and accounts, and the Director
      (HR) people and administration. This assistant does not name KPCL's current office holders because they
      change. The current Board and senior officers are listed on KPCL's official website.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, sections 1.1 and 2: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
  - id: cadres
    name: Management levels and cadres in KPCL
    aliases: [management levels, levels of management, cadres, cadre, employee cadres, corporate cadre, workmen cadre, workmen,
              grades, designations, ranks, junior management, middle management, senior management, executive director,
              executive directors, chief engineer, chief engineers, superintending engineer, executive engineer,
              assistant executive engineer, assistant engineer, junior engineer, employees of kpcl, kpcl employees, staff of kpcl]
    summary: |-
      KPCL's employees are in two cadres: the corporate cadre and the workmen cadre. The corporate cadre has three levels:
      •  Junior management: Junior Engineers, Assistant Engineers, Assistant Accounts Officers and equivalent posts, the first supervisory level.
      •  Middle management: Assistant Executive Engineers, Executive Engineers and equivalents, who execute the work in their areas.
      •  Senior management: Superintending Engineers, Deputy General Managers, Chief Engineers, General Managers and Executive Directors.
      Officers from Assistant Executive Engineer upwards hold delegated financial and disciplinary powers; workmen hold no financial or disciplinary powers. Senior managers at each project monitor their areas against set targets and report to the top level.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, chapters 2 and 3: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
  - id: decision_making
    name: How decisions are made in KPCL
    aliases: [decision making, decision-making, how are decisions made, who takes decisions, delegation of powers, delegation of power,
              powers delegated, accountability, channels of supervision, approval process, approvals in kpcl]
    summary: >-
      KPCL functions on commercial lines while following the mandates of the state government. All major decisions
      are taken by the Board. Others are taken by the Managing Director in consultation with the Audit and Technical
      Committees. The Board has vested the Managing Director with substantial management powers, and these are
      delegated further, down to Assistant Executive Engineers, through a documented scheme of delegation of powers.
      Officers at each project (Executive Directors, Chief Engineers, General Managers and Deputy General Managers for
      finance and HR) monitor their areas against set targets and benchmarks and report regularly to the top. KPCL
      funds new projects, renovation and maintenance from its own earnings and commercial borrowing, receives no
      subsidy from the state government, and has its budget vetted by the Audit Committee and approved by the Board.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, chapters 3, 5, 11-13: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
  - id: offices
    name: KPCL's offices and working hours
    aliases: [kpcl offices, offices of kpcl, office addresses, project offices, green building, shakti bhavan, shakthi bhavan,
              corporate office, working hours, office hours, office timings, kpcl timings, where are kpcl offices, kpcl's offices,
              where are the offices, offices in karnataka, project office, project offices of kpcl]
    summary: |-
      KPCL's head office is Shakthi Bhavan, 82 Race Course Road, Bengaluru, with a second corporate office in the KPCL Green Building, 3 Palace Road, Bengaluru. Its projects have offices across the state:
      •  Bengaluru: the Yelahanka combined cycle plant. Ramanagara: the Bidadi waste-to-energy plant.
      •  Raichur: Raichur Thermal Power Station at Shakthinagar and Yeramarus Thermal Power Station. Ballari: Bellary Thermal Power Station at Kudithini.
      •  Shivamogga and Udupi: the Sharavathi Valley Project at Jog Falls and the Varahi project at Masthikatte and Hosangadi.
      •  Uttara Kannada: the Kalinadi project at Ambikanagar, Ganeshgudi and Kadra, and the Gerusoppa project.
      •  Belagavi: Ghataprabha at Hidkal Dam. Bagalkot: the Almatti dam power house. Koppal: Munirabad. Mandya: Shivanasamudra.
      •  Outside Karnataka: the Godhna project office in Janjgir-Champa district, Chhattisgarh.
      The head office works 9.30 am to 5.30 pm and is closed on the second and fourth Saturdays. Project offices work 9.30 am to 5.30 pm on weekdays and 9.30 am to 1.30 pm on Saturdays, while shift staff at the stations work round the clock in three shifts.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, sections 1.6 and 1.7: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
  - id: vigilance
    name: Vigilance in KPCL
    aliases: [vigilance, chief vigilance officer, cvo, vigilance wing, corruption complaint, report corruption, complaint against an officer]
    summary: >-
      KPCL has a Chief Vigilance Officer who reports directly to the Managing Director, alongside the General Manager
      (Internal Audit). Employees and directors can also report suspected fraud, misconduct or rule violations in
      confidence under the company's Whistle Blower Policy and Vigil Mechanism. Ask "What is KPCL's whistle blower
      policy?" for how that works.
    sources:
      - "KPCL organogram, updated 25.05.2026"
      - https://kpcl.karnataka.gov.in/3/kpcl-senior-officials/en
  - id: energy_department
    name: The Energy Department, KPCL's administrative department
    aliases: [energy department, department of energy, energy dept, administrative department, parent department, energy minister,
              minister for energy, who controls kpcl, government department for kpcl, which department, department controls kpcl,
              department that controls kpcl, ministry for kpcl, under which department]
    summary: >-
      KPCL is administered through the Government of Karnataka's Energy Department, which also oversees the
      transmission company KPTCL and the five electricity supply companies. The Minister for Energy is normally
      Vice Chairman of KPCL's Board, and the Additional Chief Secretary of the Energy Department chairs the Board's
      CSR Committee. The state appoints KPCL's Board, its Managing Director and its Director (HR).
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, sections 1.1 and 2"
      - KPCL CSR Policy 2022 (CSR Committee composition)

# -----------------------------------------------------------------------------
# KPCL's own rules, manuals and policies (what the company itself has adopted).
policies:
  - id: service_rules
    name: KPCL's service rules and manuals
    aliases: [service rules, service regulations, hrd manual, hr manual, human resources manual, standing orders, standing regulations,
              conduct rules, rules for employees, employee rules, transfer rules, promotion rules, rules of kpcl, kpcl rules,
              rules and regulations, manuals of kpcl, kpcl manuals, pay and allowances, e-office manual]
    summary: >-
      KPCL's rules for its employees are compiled in its HRD Manual, which covers recruitment, transfer, promotion,
      pay and allowances, the medical scheme and related matters. Day-to-day administration also follows its Standing
      Regulations and circulars, and disciplinary matters follow the company's Standing Orders. Decisions and
      spending follow the Board's scheme of delegation of powers. Copies of the rules can be requested from the
      General Manager (Administration & HR) at the head office, on payment of the fee fixed under the Karnataka
      Right to Information Rules, 2005.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024, sections 3.1-3.3, 6 and 7.3: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
  - id: csr_policy
    name: KPCL's Corporate Social Responsibility (CSR) policy
    aliases: [csr, csr policy, corporate social responsibility, csr spending, csr activities, csr work, social responsibility,
              enterprise social responsibility, esr, csr projects]
    summary: |-
      KPCL's CSR policy, approved by its Board on 8 April 2022, directs its social spending mainly to the rural and remote areas around its projects and stations. It follows Schedule VII of the Companies Act, 2013.
      •  Focus areas: drinking water, sanitation, education and skills (including school infrastructure), healthcare, rural development, livelihoods for disadvantaged groups, environmental protection and sports.
      •  How it is governed: a three-tier structure of the Board, its CSR Committee, and the Managing Director with project heads. The CSR Committee is chaired by the Additional Chief Secretary of the Energy Department. The Board approves the annual action plan.
      •  How much: at least 2% of the average net profit of the three preceding years, every year. Unspent money for ongoing projects goes to an Unspent CSR Account and must be used within three years.
      •  Controls: administrative overheads are capped at 5% of CSR spending, projects of ₹1 crore or more are independently assessed for impact, and the policy and approved projects are disclosed publicly.
      KPCL publishes a list of its CSR activities every year.
    sources:
      - "KPCL CSR Policy (Board, 284th meeting, 08.04.2022): https://kpcl.karnataka.gov.in/storage/pdf-files/CSR%20Policy%20_KPCL%202021-22.pdf"
      - https://kpcl.karnataka.gov.in/126/corporate-social-responsibility/en
  - id: whistle_blower
    name: KPCL's Whistle Blower Policy and Vigil Mechanism
    aliases: [whistle blower, whistleblower, whistle-blower, whistle blower policy, vigil mechanism, protected disclosure,
              report misconduct, report fraud, how to report wrongdoing]
    summary: |-
      KPCL's Whistle Blower Policy and Vigil Mechanism, 2020 (approved by the Board on 7 January 2020 under Section 177(9) of the Companies Act, 2013) lets directors and employees report unethical behaviour, suspected fraud or breaches of the code of conduct without fear of victimisation.
      •  How to report: in writing, within 30 days of becoming aware, in a sealed envelope marked "Protected Disclosure under the Whistle Blower policy", addressed to the Nodal Officer, who is the Director (HR) at the head office. Anonymous complaints are not taken up, but the complainant's identity is kept confidential.
      •  Who decides: a screening committee of the Managing Director, Finance Director and Director (HR) recommends within 90 working days whether to investigate; investigations normally finish within 120 days, and the Audit Committee decides the outcome. Complaints about a director go straight to the Chairman of the Audit Committee.
      •  Protection: whistle blowers are protected from retaliation, transfer or demotion for a genuine disclosure, but knowingly false or malicious complaints lead to disciplinary action.
      Personal grievances are not covered by this policy.
    sources:
      - "KPCL Whistle Blower Policy/Vigil Mechanism 2020 (Board, 273rd meeting, 07.01.2020): https://kpcl.karnataka.gov.in/storage/pdf-files/3Whistle-Blower-Policy-KPCL.pdf"
  - id: recruitment
    name: How KPCL recruits
    aliases: [recruitment, recruitment rules, recruitment process, jobs at kpcl, kpcl jobs, job at kpcl, how to join kpcl, careers,
              careers at kpcl, vacancies, kpcl vacancies, hyderabad karnataka reservation, kalyana karnataka reservation, 371j,
              article 371j, hk quota, kannada language test, seniority list, recruit, recruits, recruiting, hiring, hire,
              selection process, entrance exam, how does kpcl recruit]
    summary: >-
      KPCL recruits through public notifications on its website for posts such as Assistant Engineers and Junior
      Engineers (civil, electrical, mechanical and instrumentation), chemists and chemical supervisors, accounts and
      medical officers, and legal officers on contract. Selection is by written examination, followed by publication
      of a provisional list, document and certificate verification, and a final selection list. Candidates must pass
      a Kannada language test. Posts are filled separately for the Kalyana Karnataka (Hyderabad-Karnataka) region
      under the Article 371J reservation order of 2013 and for the rest of the state, each with its own list. The
      recruitment rules themselves are part of KPCL's HRD Manual.
    sources:
      - https://kpcl.karnataka.gov.in/18/careers--and--recruitment/en
      - https://kpcl.karnataka.gov.in/32/human-resource/en
  - id: rti
    name: Getting information from KPCL under the RTI Act
    aliases: [rti, right to information, rti act, rti application, public information officer, public information officers, pio,
              apio, first appellate authority, appellate authority, how to get information from kpcl, information request]
    summary: |-
      KPCL is a public authority under the Right to Information Act, 2005. Anyone can ask it for information online through the Karnataka RTI portal or by a written application, paying the fee set by the Karnataka Right to Information Rules, 2005.
      •  Where to apply: each subject has its own Public Information Officer, Assistant Public Information Officer and First Appellate Authority. At the head office these cover corporate affairs, finance, technical matters and HR; in the field they cover the Sharavathi, Varahi and Kali valley projects, the Bellary, Raichur and Yeramarus thermal stations, the Godhna project, the KPC Gas Power Corporation and Raichur Power Corporation.
      •  What it publishes proactively: under Section 4(1)(b), a handbook on its organisation and functions, powers and duties, decision-making, rules and manuals, budget, directory of officers, the monthly pay of its officers and employees, and the list of information officers.
      •  How information is shared: notice boards, inspection of records, copies of documents, printed manuals and the official website.
      A single application should cover one subject and not exceed 150 words.
    sources:
      - "KPCL RTI 4(1)(b) handbook, Sept 2024: https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
      - "KPCL list of PIOs, APIOs and FAAs, updated 28.07.2026: https://kpcl.karnataka.gov.in/uploads/media_to_upload1785236797.pdf"
      - https://kpcl.karnataka.gov.in/12/rti-4%281%29/en
  - id: procurement
    name: How KPCL buys (tenders and procurement)
    aliases: [tenders, tender, kpcl tenders, procurement, e-procurement, purchase manual, purchase procedure, blacklisted firms,
              blacklisted, contractors, vendor registration, agency payments, how to supply to kpcl]
    summary: >-
      KPCL publishes its tenders on the Government of Karnataka's public procurement portal, as the state's
      transparency-in-procurement law requires of state undertakings, and awards contracts under its own purchase
      procedures and the Board's delegation of powers. It also publishes a list of blacklisted firms and lets
      suppliers and agencies track their payments online.
    sources:
      - https://kppp.karnataka.gov.in/
      - https://kpcl.karnataka.gov.in/51/blacklisted-firms/en
      - https://kpcl.karnataka.gov.in/45/agency-payments/en

