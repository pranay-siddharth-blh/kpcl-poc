kpcl:
  aliases: [kpcl, karnataka power corporation, karnataka power corporation limited, karnataka power corp, the corporation, the company]
  name: Karnataka Power Corporation Limited (KPCL)
  summary: >-
    Karnataka Power Corporation Limited (KPCL) is the Government of Karnataka's own power generation
    company. It builds, owns and runs hydro-electric, coal-fired thermal, gas, solar, wind and
    waste-to-energy power stations in Karnataka and sells the electricity they produce to the state's
    five electricity supply companies (ESCOMs), which distribute it to consumers. It was incorporated on
    20 July 1970 and has its registered office at Shakti Bhavan, 82 Race Course Road, Bengaluru.
  founded: >-
    KPCL was incorporated on 20 July 1970 under the Companies Act, 1956 (registration number 1919), as a
    company wholly owned by the Government of Karnataka. It was formed to take over power generation from
    the Government of Mysore's Hydro Electric Construction Projects and to concentrate on developing new
    power projects in the state. It began with an installed capacity of 746 MW.
  legal_status: >-
    KPCL is a State Government company (a state public sector undertaking), wholly owned by the
    Government of Karnataka and administered through the state's Energy Department. Its Corporate
    Identification Number (CIN) is U85110KA1970SGC001919.
  ownership: >-
    KPCL is wholly owned by the Government of Karnataka. It in turn holds stakes in two subsidiaries
    that appear in this data: Raichur Power Corporation Limited (RPCL, a joint venture with BHEL, which
    owns the Yeramarus Thermal Power Station) and KPCL Gas Power Corporation Limited (KPCGPCL, which owns
    the Yelahanka Combined Cycle Power Plant).
  head_office: Shakti Bhavan, No. 82, Race Course Road, Bengaluru 560 001, Karnataka.
  office_holders: >-
    KPCL is run by a Board of Directors constituted by the Government of Karnataka. The Chief Minister is
    usually its Chairman and the Minister for Energy its Vice Chairman. Day-to-day management rests with the
    Managing Director, a senior civil-service officer appointed by the state, supported by three other
    full-time directors: the Technical Director, the Finance Director and the Director (HR). This assistant
    does not name KPCL's current office holders because they change. The current Board and senior officers
    are listed on KPCL's official website. Ask "What is KPCL's organisation structure?" for the full hierarchy.
  mission: |-
    KPCL's stated mission is to reach "higher vantage points in the world of power engineering" by starting with a world-class organisation, building in efficiency and cost control, and making sure progress is in harmony with the environment. It pursues this by:
    •  exploring, identifying and developing opportunities in power generation;
    •  devising innovative ways of setting up and operating power plants;
    •  investing in technical competence, systems, processes and capability;
    •  empowering its people, work teams and support network to achieve these objectives.
  why_it_exists: >-
    KPCL was set up in 1970 because the Karnataka government wanted a separate body to build and run
    power stations, leaving the Karnataka Electricity Board to handle transmission and supply. This
    separation of generation from distribution came decades before the national power-sector reforms
    of the late 1990s and 2000s. Its early work was developing the state's large river valleys for
    hydro power, beginning with the Kali (Kalinadi) valley, where the Nagjhari power house was
    commissioned in 1980. It later added coal-fired stations to meet growing demand when rainfall-
    dependent hydro could not. Today its purpose is to give Karnataka a reliable, state-owned source of
    electricity at tariffs approved by the state regulator.
  what_it_does: >-
    KPCL plans, builds, operates and maintains power stations; runs the dams and reservoirs that feed
    its hydro stations; buys coal for its thermal stations; and sells its output to the ESCOMs under
    power purchase agreements at tariffs set by the Karnataka Electricity Regulatory Commission (KERC).
    The State Load Despatch Centre decides, hour by hour, how much each station should generate for
    the grid.
  regulated_by: >-
    KPCL works under the Electricity Act, 2003 and the Karnataka Electricity Reform Act, 1999. The Karnataka
    Electricity Regulatory Commission (KERC) sets the tariff for its sales to the ESCOMs and the operating
    norms that tariff assumes. The Central Electricity Authority (CEA) sets technical and safety standards
    and the yearly generation target for each station. The State Load Despatch Centre, run by KPTCL,
    directs how much each station generates. Its thermal stations must meet the Ministry of Environment,
    Forest and Climate Change's emission norms, enforced by the Karnataka State Pollution Control Board.
    As a state government company it reports to the Government of Karnataka's Energy Department, and its
    accounts are audited under the oversight of the Comptroller and Auditor General of India (CAG). Ask
    "What is KERC?", "What is the CEA?" or "What is the Electricity Act?" for detail on each.
  generation_mix: >-
    KPCL generates from coal-fired thermal stations (Raichur, Bellary and Yeramarus), major hydro
    stations on the Sharavathi, Kali, Varahi, Krishna, Kaveri and other rivers, minor and mini hydel
    stations, a gas combined-cycle plant at Yelahanka (Bengaluru), a waste-to-energy plant at Bidadi,
    and small solar and wind farms. Hydro output depends heavily on the monsoon, so thermal
    generation carries more of the load in dry years.
  capacity: >-
    Published figures put KPCL's installed capacity at about 8,700-8,800 MW before the 370 MW Yelahanka
    gas plant and the 11.5 MW Bidadi waste-to-energy plant were added. The 33 stations and 103 units in
    this system (including the subsidiaries' stations) total 9,119.8 MW: 5,020 MW coal-fired thermal,
    3,640.4 MW major hydro, 39.35 MW minor hydro, 370 MW gas, 34 MW solar, 11.5 MW waste-to-energy and
    4.555 MW wind.
  history:
    - "1970: KPCL incorporated on 20 July 1970 with 746 MW of installed capacity."
    - "1980: Nagjhari power house, the first in the Kali valley, commissioned (first stage of the Kalinadi project)."
    - "1985: First unit of the Raichur Thermal Power Station, Karnataka's first coal-fired thermal station, commissioned."
    - "1999: The Karnataka Electricity Reform Act, 1999 restructured the power sector; KPTCL formed on 1 August 1999 and KERC constituted in November 1999."
    - "2002: Distribution split into electricity supply companies (ESCOMs), which buy KPCL's power."
    - "2007: Bellary Thermal Power Station Unit 1 (500 MW) commissioned; Unit 2 (500 MW) followed in 2012 and supercritical Unit 3 (700 MW) in 2016."
    - "2016-2017: Yeramarus Thermal Power Station (2 x 800 MW, India's first 800 MW supercritical units, built by BHEL for RPCL) entered commercial operation."
    - "2024: Yelahanka Combined Cycle Power Plant (370 MW), Karnataka's first gas-based plant, and the 11.5 MW Bidadi waste-to-energy plant added."
  in_this_data: >-
    This system holds KPCL's generation records for 33 stations and 103 units from 1 April 2015 to
    30 April 2025: daily and monthly generation, PLF, PAF, auxiliary consumption, fuel, outages and
    trips, back-down, CEA targets, coal stock and receipts, reservoir levels and the state grid.
  sources:
    - https://en.wikipedia.org/wiki/Karnataka_Power_Corporation
    - https://www.zaubacorp.com/company/KARNATAKA-POWER-CORPORATION-LIMITED/U85110KA1970SGC001919
    - http://karnatakapower.com/en/portfolio/nagjhari-power-house/
    - https://kpcl.karnataka.gov.in/20/about--us/en
    - https://kpcl.karnataka.gov.in/22/mission/en
    - "KPCL RTI Section 4(1)(b) handbook, version 2.0, September 2024 (chapters 1-3): https://kpcl.karnataka.gov.in/storage/pdf-files/RTI-4(1)(b)-EnglishManual.pdf"
    - Station records in this system (33 stations, 103 units)

