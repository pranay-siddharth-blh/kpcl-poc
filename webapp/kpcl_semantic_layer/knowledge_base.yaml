# =============================================================================
# KPCL Generation Assistant — general knowledge base
# =============================================================================
# Used by webapp/kpcl-ai-app/app/knowledge.py to answer GENERAL questions: what KPCL is,
# who owns it, why it exists, its history, its subsidiaries, what a station is, and the laws,
# regulators and rules it works under. It is also the fallback when the generation data
# cannot answer. Figures about generation, PLF, outages, coal or reservoirs always come from
# the warehouse, never from this file.
#
# Station capacities and unit counts are taken from this system's own station records
# (mart_dim_station), so they agree with every data answer. The organisation, policy and public-information
# sections come from KPCL's official website (kpcl.karnataka.gov.in): its organogram (25 May 2026), RTI 4(1)(b)
# handbook (Sept 2024), PIO list (28 July 2026), CSR and Whistle Blower policies, and its About, Mission, Awards,
# Projects, Joint Ventures, Careers, Consultancy and Environment pages (researched 30 September 2026). Company, history and regulatory
# facts come from the sources listed in each section. Facts that change often (office holders,
# staff numbers, finances, tariffs) are deliberately left out. Last researched: 29 September 2026.
# =============================================================================

