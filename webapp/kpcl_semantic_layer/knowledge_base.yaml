stations:
  - key: RTPS
    name: Raichur Thermal Power Station
    type: Coal-fired thermal
    capacity_mw: 1720
    units: 8
    summary: >-
      Raichur Thermal Power Station, at Shaktinagar in Raichur district, is Karnataka's first coal-fired
      thermal power station. It has seven 210 MW units and one 250 MW unit (1,720 MW). The first unit
      was commissioned in March 1985, and Unit 8 (250 MW) was added last. It draws cooling water from the
      Krishna river and burns coal supplied mainly by Western Coalfields and Mahanadi Coalfields.
    sources: [https://en.wikipedia.org/wiki/Raichur_Thermal_Power_Station]
  - key: BTPS
    name: Bellary Thermal Power Station
    type: Coal-fired thermal
    capacity_mw: 1700
    units: 3
    summary: >-
      Bellary Thermal Power Station, at Kudatini in Ballari district, has three units: Unit 1 (500 MW,
      commissioned December 2007), Unit 2 (500 MW, January 2012) and Unit 3 (700 MW, a supercritical unit,
      March 2016), 1,700 MW in all. The units were supplied by BHEL.
    sources: [https://en.wikipedia.org/wiki/Bellary_Thermal_Power_station]
  - key: YTPS
    name: Yeramarus Thermal Power Station
    type: Coal-fired thermal (supercritical)
    capacity_mw: 1600
    units: 2
    summary: >-
      Yeramarus (Yermarus) Thermal Power Station, near Yegnur in Raichur district, has two 800 MW
      supercritical units (1,600 MW), described as India's first 800 MW supercritical units, built by BHEL.
      Unit 1 began commercial operation in March 2017 and Unit 2 in April 2017. It is owned by Raichur Power
      Corporation Limited (RPCL), a KPCL-BHEL joint venture.
    sources: [https://en.wikipedia.org/wiki/Yermarus_Thermal_Power_Station]
  - key: YCCPP
    name: Yelahanka Combined Cycle Power Plant
    type: Gas / combined cycle
    capacity_mw: 370
    units: 2
    summary: >-
      Yelahanka Combined Cycle Power Plant in Bengaluru is Karnataka's first gas-based power station
      (370 MW), built on the site of an old diesel plant with BHEL as contractor and owned by KPCL Gas Power
      Corporation Limited. News reports put its formal commissioning in September 2024; this system records
      it from July 2024. Gas comes from GAIL. News reports in March 2026 said GAIL had suspended gas supply
      during the West Asia crisis.
    sources:
      - https://www.businessworld.in/article/karnataka%E2%80%99s-first-gas-based-power-plant-yelahanka-ccpp-to-be-commissioned-on-24-september-534064
      - https://telanganatoday.com/gulf-crisis-gail-halts-gas-supply-to-yelahanka-power-plant-generation-may-be-hit
  - key: SGS
    name: Sharavathy Generating Station
    type: Major hydro
    capacity_mw: 1035
    units: 10
    summary: >-
      Sharavathy Generating Station in Shivamogga district, near Jog Falls, is KPCL's largest hydro
      station: ten 103.5 MW units (1,035 MW). It is fed by the Linganamakki and Talakalale reservoirs on the
      Sharavathi river. Its first units were commissioned in 1964.
    sources: [https://en.wikipedia.org/wiki/Sharavathi_River]
  - key: NPH
