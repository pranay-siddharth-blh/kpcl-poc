    summary: >-
      KPCL's consultancy division offers its power-project experience to other organisations, from concept to
      commissioning: feasibility studies and detailed project reports, design and engineering, procurement and
      construction support, project management, supervision of civil, electrical and mechanical work, operation and
      maintenance, dam rehabilitation, and renovation and modernisation of stations. Past clients include the Central
      Electricity Authority (project reports for hydro schemes), NTPC's hydro arm and the Nuclear Power Corporation
      of India (investigations for Kaiga Units 3 and 4), as well as state water and irrigation corporations.
    sources: [https://kpcl.karnataka.gov.in/28/consultancy-services-offered/en]

# -----------------------------------------------------------------------------
# Laws, regulators and rules KPCL works under.
regulation:
  - id: electricity_act_2003
    name: The Electricity Act, 2003
    aliases: [electricity act, electricity act 2003, ea 2003]
    summary: >-
      The Electricity Act, 2003 is the central law governing electricity in India. It replaced the Indian
      Electricity Act, 1910, the Electricity (Supply) Act, 1948 and the Electricity Regulatory Commissions
      Act, 1998. For a generator like KPCL it matters in five ways. Generation needs no licence (Section 7),
      but hydro schemes above a set cost need the Central Electricity Authority's concurrence (Section 8).
      Generating companies must run their stations under the grid rules and technical standards
      (Section 10). The tariff for power sold to distribution companies is fixed by the state commission
      (Section 62). The State Load Despatch Centre directs grid operation (Sections 32-33).
    sources: [https://en.wikipedia.org/wiki/Electricity_Act,_2003]
  - id: reform_act_1999
    name: The Karnataka Electricity Reform Act, 1999
    aliases: [karnataka electricity reform act, reform act, electricity reform act, kera]
    summary: >-
      The Karnataka Electricity Reform Act, 1999 restructured Karnataka's power sector. The Karnataka
      Electricity Board was dissolved, its transmission and distribution passed to the new Karnataka Power
      Transmission Corporation Limited (KPTCL, formed on 1 August 1999), and the Karnataka Electricity
      Regulatory Commission was set up. Distribution was then split into electricity supply companies in
      2002. KPCL, already separate since 1970, stayed the state's generator.
    sources:
      - https://www.indiacode.nic.in/handle/123456789/7141
      - https://en.wikipedia.org/wiki/Electricity_supply_companies_in_Karnataka
  - id: kerc
    name: Karnataka Electricity Regulatory Commission (KERC)
    aliases: [kerc, karnataka electricity regulatory commission, the regulator, state regulator, state commission]
    summary: >-
      The Karnataka Electricity Regulatory Commission is the state's electricity regulator, constituted in
      November 1999 under Section 3(1) of the Karnataka Electricity Reform Act, 1999 and now working under the
      Electricity Act, 2003. It sets the tariff at which KPCL sells power to the ESCOMs (under multi-year
      tariff regulations, first issued on 31 May 2006), approves power purchase agreements, fixes retail
      tariffs, and sets the operating norms, such as availability and auxiliary consumption, that tariffs
      assume. It sits in Bengaluru.
    sources:
      - https://kerc.karnataka.gov.in/32/about-us/en
      - https://solarquarter.com/2024/11/27/25-years-of-kerc-pioneering-power-reforms-and-renewable-energy-growth-in-karnataka/
  - id: cea
    name: Central Electricity Authority (CEA)
    aliases: [cea, central electricity authority]
    summary: >-
      The Central Electricity Authority is the Government of India's technical adviser on power, a statutory
      body under the Ministry of Power (Section 70 of the Electricity Act, 2003). It frames technical and
      safety standards, prepares the National Electricity Plan, approves major hydro schemes, and each year
      sets a generation target for every major station in the country. Those station targets are the "CEA
      targets" in this system. Achievement against them is a standard measure of how a station performed.
    sources: [https://cea.nic.in/]
  - id: kptcl
    name: Karnataka Power Transmission Corporation Limited (KPTCL)
    aliases: [kptcl, karnataka power transmission corporation, transmission company]
    summary: >-
      KPTCL, formed on 1 August 1999 when the Karnataka Electricity Board was dissolved, owns and runs the
      state's high-voltage transmission network, which carries KPCL's power from the stations to the ESCOMs.
      The State Load Despatch Centre works within KPTCL.
    sources: [https://en.wikipedia.org/wiki/Karnataka_Power_Transmission_Corporation]
  - id: sldc
    name: State Load Despatch Centre (SLDC)
    aliases: [sldc, state load despatch centre, state load dispatch center, load despatch, load dispatch]
    summary: >-
      The State Load Despatch Centre is the apex body for running Karnataka's grid (Sections 31-33 of the
      Electricity Act, 2003). It schedules and despatches power from every station minute by minute, usually
      calling on the cheapest sources first ("merit order"). Its instructions to reduce output for grid or cost
      reasons are the back-down recorded in this system. In Karnataka it is run by KPTCL.
    sources: [https://en.wikipedia.org/wiki/Electricity_Act,_2003]
  - id: escoms
    name: Electricity supply companies (ESCOMs)
    aliases: [escoms, escom, bescom, mescom, hescom, gescom, cesc, cescom, electricity supply companies, discoms, distribution companies]
    summary: >-
      Karnataka's five electricity supply companies buy power from KPCL, central stations and private
      producers and distribute it to consumers. They are BESCOM (Bengaluru), MESCOM (Mangaluru), HESCOM
      (Hubballi), GESCOM (Kalaburagi) and CESC (Mysuru). They were created when distribution was separated
      from KPTCL in 2002. KPCL's income comes mainly from its sales to them.
    sources: [https://en.wikipedia.org/wiki/Electricity_supply_companies_in_Karnataka]
  - id: emission_norms
    name: Emission norms for thermal power stations
    aliases: [emission norms, pollution norms, fgd, flue gas desulphurisation, flue gas desulfurization, environment rules, environmental norms]
    summary: >-
      Coal-fired stations must meet the emission limits notified by the Ministry of Environment, Forest and
      Climate Change on 7 December 2015 (Environment (Protection) Amendment Rules, 2015). These rules
      tightened limits on particulate matter, sulphur dioxide, nitrogen oxides and mercury and on water use.
      Meeting the sulphur-dioxide limit generally requires flue gas desulphurisation (FGD) units. The
      Karnataka State Pollution Control Board enforces consent conditions for each station.
    sources: [https://moef.gov.in/]
  - id: companies_act_2013
    name: The Companies Act, 2013 and KPCL
    aliases: [companies act, companies act 2013, company law, corporate governance, governance rules, section 135, section 177]
    summary: >-
      KPCL was incorporated under the Companies Act, 1956 and is now governed by the Companies Act, 2013 as a
      Government company, one where the state holds more than half the shares. The Act shapes its governance in
      several ways. It sets the Board's powers and meetings and the Audit Committee (Section 177). It requires a
      vigil mechanism for directors and employees (Section 177(9)), which KPCL runs as its Whistle Blower Policy. It
      requires CSR spending of at least 2% of average net profit (Section 135 and Schedule VII), under KPCL's CSR
      policy. And it requires audited annual accounts and an annual return. Minutes of Board and committee
      meetings are not open to the public under company law.
    sources:
      - https://www.mca.gov.in/content/mca/global/en/acts-rules/ebooks/acts.html
      - "KPCL RTI 4(1)(b) handbook, chapter 8; KPCL CSR and Whistle Blower policies"
  - id: cag_audit
    name: Audit of KPCL (statutory auditors and the CAG)
    aliases: [cag, comptroller and auditor general, audit of kpcl, kpcl audit, statutory audit, statutory auditor, auditors of kpcl,
              internal audit, who audits kpcl]
    summary: >-
      As a Government company, KPCL's accounts are audited by statutory auditors appointed by the Comptroller and
      Auditor General of India (CAG), who can also carry out a supplementary audit and comment on the accounts
      (Sections 139 and 143 of the Companies Act, 2013). Inside the company, the General Manager (Internal Audit)
      reports directly to the Managing Director, and the Board's Audit Committee reviews the accounts and the audit
      findings.
    sources:
      - https://cag.gov.in/
      - "KPCL organogram, updated 25.05.2026 (GM (IA) under the MD)"
  - id: fly_ash_rules
    name: Fly ash rules for thermal stations
    aliases: [fly ash, flyash, fly-ash, ash utilisation, ash utilization, ash disposal, ash pond, bottom ash, fly ash notification]
    summary: >-
      Coal-fired stations must put all the fly ash they produce to use, in cement, bricks, roads, mine filling and
      similar work, under the Ministry of Environment, Forest and Climate Change's fly ash notification of 31
      December 2021, which replaced earlier notifications from 1999 onwards. Stations that fall short face
      environmental compensation. KPCL reports fly ash utilisation for the Raichur, Bellary and Yeramarus thermal
      stations and manages ash supply through an online system.
    sources:
      - https://kpcl.karnataka.gov.in/117/fly-ash-utilization/en
      - https://moef.gov.in/
  - id: coal_mines_act_2015
    name: The Coal Mines (Special Provisions) Act, 2015
    aliases: [coal mines special provisions act, coal mines act, coal block allocation, coal blocks, coal block, coalgate]
    summary: >-
      After the Supreme Court cancelled the allocation of 214 coal blocks in 2014, the Coal Mines (Special
      Provisions) Act, 2015 set out how those blocks would be auctioned or allotted afresh. Under it the Baranj
      blocks in Maharashtra were allotted again to KPCL on 31 March 2015, and KPCL has also been allotted the
      Mandakini-A block in the Talcher coalfield (Angul district, Odisha), which is being developed to supply its
      thermal stations.
    sources:
      - https://www.gem.wiki/Integrated_Baranj_Mine
      - https://www.careratings.com/upload/CompanyFiles/PR/202508120826_Karnataka_Power_Corporation_Limited.pdf

