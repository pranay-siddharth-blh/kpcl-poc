# Terms not already in the data glossary (PLF, PAF, MU, CEA target, ESCOM ... are defined there).
glossary:
  KERC: Karnataka Electricity Regulatory Commission, the state electricity regulator that sets KPCL's tariffs.
  KPTCL: Karnataka Power Transmission Corporation Limited, which runs the state's transmission network.
  SLDC: State Load Despatch Centre, which schedules and despatches power from every station in Karnataka.
  PPA: Power purchase agreement, the long-term contract under which an ESCOM buys a station's power.
  IPP: Independent power producer, a privately owned generating company.
  Supercritical: A coal-fired unit whose steam runs above water's critical pressure, making it more efficient; YTPS and BTPS Unit 3 are supercritical.
  Combined cycle: A gas plant where a gas turbine's hot exhaust raises steam for a second (steam) turbine, as at Yelahanka.
  Pumped storage: A hydro scheme that pumps water uphill when power is spare and generates with it at peak demand.
  Tail race: The channel carrying water away from a hydro station; a tail-race station, like Gerusoppa, reuses that water.
  Merit order: The practice of despatching the cheapest available power first.
  RPCL: Raichur Power Corporation Limited, the KPCL-BHEL joint venture that owns YTPS.
  KPCGPCL: KPCL Gas Power Corporation Limited, which owns the Yelahanka gas plant.
  BHEL: Bharat Heavy Electricals Limited, the central public-sector company that built many of KPCL's thermal units.
  GAIL: GAIL (India) Limited, which supplies natural gas to the Yelahanka plant.
  Kalinadi: The Kali river hydro-electric project in Uttara Kannada (Supa, Nagjhari, Kodasalli, Kadra).
  KECML: Karnataka EMTA Coal Mines Limited, KPCL's joint venture formed to mine the Baranj coal blocks in Maharashtra for the Bellary station.
  Organogram: An organisation chart showing who reports to whom; KPCL's runs from the Chairman and Board to the Managing Director and three full-time directors.
  CVO: Chief Vigilance Officer, who looks into corruption and misconduct and reports directly to KPCL's Managing Director.
  PIO: Public Information Officer, the officer who answers applications under the Right to Information Act; KPCL has one for each subject and project.
  First Appellate Authority: The officer who hears an appeal when an RTI applicant is not satisfied with the Public Information Officer's reply.
  Executive Director: In KPCL, the senior officer who heads a thermal power station (RTPS, BTPS, YTPS) and reports to the Technical Director.
  Chief Engineer: In KPCL, a senior officer heading a design wing or the operation, maintenance or civil works of a hydro valley project.
  Superintending Engineer: A senior-management engineer in KPCL, below Chief Engineer and above Executive Engineer.
  Assistant Executive Engineer: A middle-management engineer in KPCL, the lowest level holding delegated financial and disciplinary powers.
  Workmen cadre: KPCL employees outside the officer (corporate) cadre, who hold no financial or disciplinary powers.
  O&M: Operation and maintenance, the running and upkeep of a power station.
  R&R: Rehabilitation and resettlement of people whose land is taken for a project.
glossary_sources:
  - https://en.wikipedia.org/wiki/Electricity_Act,_2003
  - https://en.wikipedia.org/wiki/Karnataka_Power_Corporation
  - KPCL organogram (25.05.2026), RTI 4(1)(b) handbook (Sept 2024) and PIO list (28.07.2026) on kpcl.karnataka.gov.in
